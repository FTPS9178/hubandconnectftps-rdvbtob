<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French Tech Paris-Saclay – B2B Matchmaking 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--red:#FF0032;--dark:#1a1a2e;--gray:#f4f4f7;--border:#e0e0e0;--text:#222;--muted:#888;--green:#00b894;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:var(--gray);color:var(--text);padding-bottom:56px;}
nav{background:var(--dark);display:flex;align-items:center;padding:0 16px;height:60px;gap:12px;flex-wrap:wrap;}
nav .nav-links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;}
nav button{background:none;border:none;color:#ccc;cursor:pointer;padding:6px 12px;border-radius:6px;font-size:.82rem;}
nav button:hover,nav button.active{background:var(--red);color:#fff;}
.page{display:none;padding:24px;max-width:1100px;margin:auto;}
.page.active{display:block;}
h1{font-size:1.4rem;margin-bottom:6px;}
h2{font-size:1rem;margin-bottom:12px;color:var(--dark);}
.subtitle{color:var(--muted);font-size:.88rem;margin-bottom:20px;}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600;margin-left:6px;}
.badge-red{background:#ffe0e6;color:var(--red);}
.badge-green{background:#d4f5ee;color:var(--green);}
.badge-vc{background:#fff3cd;color:#856404;}
.form-group{margin-bottom:12px;}
label{display:block;font-size:.83rem;font-weight:600;margin-bottom:4px;color:#444;}
input,select,textarea{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:.88rem;outline:none;transition:border .2s;}
input:focus,select:focus,textarea:focus{border-color:var(--red);}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:38px;}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--muted);background:none;border:none;font-size:.95rem;}
.btn{display:inline-block;padding:8px 18px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:#cc0028;}
.btn-outline{background:#fff;color:var(--red);border:1.5px solid var(--red);}
.btn-dark{background:var(--dark);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-sm{padding:4px 10px;font-size:.76rem;}
.btn-group{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:700px){.grid2,.grid4{grid-template-columns:1fr;}.page{padding:14px;}}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--dark) 0%,#16213e 100%);}
.login-box{background:#fff;border-radius:16px;padding:36px;width:420px;box-shadow:0 8px 40px rgba(0,0,0,.2);}
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:2px solid var(--border);}
.tab{padding:7px 16px;cursor:pointer;border-radius:8px 8px 0 0;font-size:.86rem;font-weight:600;color:var(--muted);border:none;background:none;}
.tab.active{color:var(--red);border-bottom:2px solid var(--red);margin-bottom:-2px;background:#fff5f7;}
.role-select{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.role-btn{padding:12px 6px;border:2px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;font-size:.83rem;font-weight:600;color:#666;background:#fff;}
.role-btn:hover,.role-btn.active{border-color:var(--red);color:var(--red);background:#fff5f7;}
.role-btn .icon{font-size:1.5rem;display:block;margin-bottom:4px;}
.slot{padding:5px 3px;border-radius:6px;text-align:center;cursor:pointer;border:1.5px solid transparent;transition:all .15s;min-height:36px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;}
.slot.free{background:#e8f8f2;border-color:#b2e8d4;color:#1a7a5a;}
.slot.free:hover{background:#b2e8d4;}
.slot.booked,.slot.unavailable{background:#f0f0f0;border-color:#ddd;color:#bbb;cursor:not-allowed;}
.slot.pending{background:#fff3cd;border-color:#ffc107;color:#856404;cursor:not-allowed;}
.slot.mine{background:#ffe0e6;border-color:#ffb3c1;color:var(--red);cursor:default;}
.slot.conflict{background:#fff3cd;border-color:#ffc107;color:#856404;}
.slot-name{font-size:.62rem;font-weight:600;}
.conf-card{background:#fff;border-radius:10px;padding:14px;border-left:4px solid var(--red);box-shadow:0 2px 6px rgba(0,0,0,.05);margin-bottom:10px;}
.stat-box{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.stat-num{font-size:1.8rem;font-weight:800;color:var(--red);}
.stat-label{font-size:.78rem;color:var(--muted);margin-top:3px;}
.alert{padding:9px 14px;border-radius:8px;font-size:.83rem;margin-bottom:12px;}
.alert-info{background:#e0f0ff;color:#1a5fa0;}
.alert-success{background:#d4f5ee;color:#1a7a5a;}
.alert-warn{background:#fff3cd;color:#856404;}
.alert-error{background:#ffe0e6;color:#c00;}
table{width:100%;border-collapse:collapse;font-size:.83rem;}
th{background:var(--dark);color:#fff;padding:7px 10px;text-align:left;}
td{padding:7px 10px;border-bottom:1px solid var(--border);}
.agenda-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);}
.agenda-time{min-width:65px;font-size:.8rem;font-weight:700;color:var(--red);}
.loading{text-align:center;padding:36px;color:var(--muted);}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid #eee;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.ticker-wrap{background:var(--dark);padding:6px 0;overflow:hidden;white-space:nowrap;position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;height:48px;}
.ticker-inner{display:flex;gap:20px;animation:ticker 30s linear infinite;align-items:center;}
@keyframes ticker{0%{transform:translateX(100vw);}100%{transform:translateX(-100%);}}
.ticker-logo{height:32px;width:auto;object-fit:contain;border-radius:4px;background:#fff;padding:2px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;}
.modal-box{background:#fff;border-radius:16px;padding:24px;width:min(580px,95vw);max-height:90vh;overflow-y:auto;}
.partner-logo{width:52px;height:52px;border-radius:8px;object-fit:contain;border:1px solid var(--border);background:#f9f9f9;flex-shrink:0;}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.filter-btn{padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:#555;transition:all .2s;}
.filter-btn:hover,.filter-btn.active{background:var(--red);color:#fff;border-color:var(--red);}
</style>
</head>
<body>

<div id="loginPage">
  <div class="login-wrap">
    <div class="login-box">
      <div style="text-align:center;margin-bottom:20px;">
        <img src="https://lafrenchtech-paris-saclay.fr/wp-content/uploads/2023/02/logo_ftps.png" alt="French Tech" style="height:68px;object-fit:contain;" onerror="this.style.display='none'"/>
        <div style="color:#888;font-size:.82rem;margin-top:6px;">B2B Matchmaking 2026</div>
      </div>
      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">Se connecter</button>
        <button class="tab" id="tabRegister" onclick="switchTab('register')">S'inscrire</button>

</div>

<div id="app" style="display:none;">
  <nav>
    <img src="https://lafrenchtech-paris-saclay.fr/wp-content/uploads/2023/02/logo_ftps.png" alt="FT" style="height:42px;object-fit:contain;" onerror="this.style.display='none'"/>
    <div class="nav-links" id="navLinks"></div>
    <div style="margin-left:12px;display:flex;align-items:center;gap:10px;">
      <span id="userLabel" style="color:#aaa;font-size:.8rem;"></span>
      <button class="btn btn-sm" style="color:#fff;border:1px solid #555;" onclick="logout()">Déconnexion</button>
    </div>
  </nav>
  <div id="pageContainer"></div>
  <div class="ticker-wrap">
    <span style="color:#aaa;font-size:.78rem;padding:0 16px;white-space:nowrap;flex-shrink:0;">Ils seront présents :</span>
    <div style="overflow:hidden;flex:1;"><div class="ticker-inner" id="tickerInner"></div></div>
  </div>
</div>

<script>
var SB_URL='https://eqrchmvsebuevgvuxlcw.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxcmNobXZzZWJ1ZXZndnV4bGN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3Njc0NDUsImV4cCI6MjA5NTM0MzQ0NX0.ctjU6NEmzq5x16MdC47Ozn1jj06w04YC1phu4i0i-tg';
var sb=window.supabase.createClient(SB_URL,SB_KEY);
var PSECTORS=['Financement','Accompagnement','Emploi et Création','Business et Marché','Implantation','International','Recherche','IP','Investissement'];
var SSECTORS=['Beautytech & Lifestyle','Biotech','Commerce & marketing','Défense & Cybersécurité','Drones / robotique autonome','Edtech & Future of work','Fintech & Insurtech','Foodtech & Agritech','Gaming & entertainment','Greentech & Climatetech','Healthtech','IA & Data','Industry & Deeptech','Legal & civic tech','Proptech & Smart city','Quantum computing','Software & plateformes digitales','Spatial / New Space','Sportech','Web3 & Blockchain'];
var TIMES=['14:00','14:15','14:30','14:45','15:00','15:15','15:30','15:45','16:00','16:15','16:30','16:45','17:00','17:15','17:30','17:45'];
var state={role:null,user:null,profile:null,partner:null,startup:null};
var allPartners=[];

function ge(id){return document.getElementById(id);}
function val(id){var e=ge(id);return e?e.value.trim():'';}
function showPage(id){ge('loginPage').style.display=id==='login'?'block':'none';ge('app').style.display=id==='app'?'block':'none';}
function setMsg(msg,type){var e=ge('authMsg');if(e)e.innerHTML=msg?'<div class="alert alert-'+(type||'info')+'" style="margin-top:10px;">'+msg+'</div>':'';}
function spinEl(el){el.innerHTML='<div class="loading"><div class="spinner"></div><div>Chargement...</div></div>';}
function togglePw(id,btn){var i=ge(id);i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'👁':'🙈';}
function closeModal(){var m=document.querySelector('.modal-overlay');if(m)m.remove();}
function showModal(html){var o=document.createElement('div');o.className='modal-overlay';o.innerHTML='<div class="modal-box">'+html+'</div>';document.body.appendChild(o);}

function switchTab(tab){
  ge('tabLogin').classList.toggle('active',tab==='login');
  ge('tabRegister').classList.toggle('active',tab==='register');
  setMsg('');
  if(tab==='login'){showLogin();}else{showRegister();}
}

function showLogin(){
  ge('authForm').innerHTML=
    '<div class="form-group"><label>Email</label><input id="aEmail" type="email" placeholder="votre@email.fr"/></div>'+
    '<div class="form-group"><label>Mot de passe</label><div class="pw-wrap"><input id="aPass" type="password" placeholder="••••••••"/><button class="pw-eye" onclick="togglePw(\'aPass\',this)" type="button">👁</button></div></div>'+
    '<button class="btn btn-primary" style="width:100%;margin-top:4px;" onclick="doLogin()">Se connecter →</button>'+
    '<div style="text-align:center;margin-top:10px;"><a href="#" onclick="showForgot();return false;" style="color:var(--red);font-size:.82rem;">Mot de passe oublié ?</a></div>';
}

function showForgot(){
  ge('authForm').innerHTML=
    '<div class="alert alert-info" style="font-size:.82rem;">Entrez votre email pour recevoir un lien.</div>'+
    '<div class="form-group"><label>Email</label><input id="aEmail" type="email" placeholder="votre@email.fr"/></div>'+
    '<button class="btn btn-primary" style="width:100%;" onclick="sendReset()">Envoyer →</button>'+
    '<div style="text-align:center;margin-top:10px;"><a href="#" onclick="showLogin();return false;" style="color:var(--red);font-size:.82rem;">← Retour</a></div>';
}

function sendReset(){
  var email=val('aEmail');
  if(!email){setMsg('Entrez votre email.','warn');return;}
  sb.auth.resetPasswordForEmail(email,{redirectTo:'https://ftps9178.github.io/matching-ftps-rdvbtob/'}).then(function(r){
    setMsg(r.error?'❌ '+r.error.message:'✅ Email envoyé !',r.error?'error':'success');
  });
}

function showRegister(){
  ge('authForm').innerHTML=
    '<p style="font-size:.83rem;font-weight:600;margin-bottom:10px;color:#444;">Vous êtes :</p>'+
    '<div class="role-select">'+
    '<div class="role-btn" onclick="showRegFields(\'partner\',this)"><span class="icon">🏢</span>Partenaire</div>'+
    '<div class="role-btn" onclick="showRegFields(\'startup\',this)"><span class="icon">🚀</span>Start-up</div>'+
    '</div><div id="regFields"></div>';
}

function showRegFields(role,el){
  document.querySelectorAll('.role-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  var sectors=role==='partner'?PSECTORS:SSECTORS;
  sb.from(role==='partner'?'partners':'startups').select('id,name').order('name').then(function(res){
    var existing=res.data||[];
    var inviteField=role==='partner'?
      '<div class="form-group"><label>Code d\'invitation <span style="color:var(--red);">*</span></label>'+
      '<input id="rInviteCode" placeholder="Entrez votre code d\'invitation"/></div>':'';
    ge('regFields').innerHTML=
      inviteField+
      '<div class="form-group"><label>Contact <span style="color:var(--muted);font-size:.76rem;">(Prénom Nom)</span></label><input id="rContact" placeholder="Ex: Marie Dupont"/></div>'+
      '<div class="form-group"><label>Email</label><input id="rEmail" type="email" placeholder="votre@email.fr"/></div>'+
      '<div class="form-group"><label>Mot de passe</label><div class="pw-wrap"><input id="rPass" type="password" placeholder="Min. 6 caractères"/><button class="pw-eye" onclick="togglePw(\'rPass\',this)" type="button">👁</button></div></div>'+
      '<div class="form-group"><label>Confirmer</label><div class="pw-wrap"><input id="rPass2" type="password" placeholder="••••••••"/><button class="pw-eye" onclick="togglePw(\'rPass2\',this)" type="button">👁</button></div></div>'+
      '<hr style="margin:12px 0;border-color:var(--border);">'+
      '<div class="form-group"><label>Rejoindre une société existante</label>'+
      '<select id="rExisting" onchange="toggleNewSoc(this.value)">'+
      '<option value="">-- Nouvelle société --</option>'+
      existing.map(function(e){return '<option value="'+e.id+'">'+e.name+'</option>';}).join('')+
      '</select></div>'+
      '<div id="newSocFields">'+
      '<div class="form-group"><label>Nom de la société</label><input id="rSociete"/></div>'+
      '<div class="form-group"><label>Secteur</label><select id="rSecteur"><option value="">-- Choisissez --</option>'+
      sectors.map(function(s){return '<option>'+s+'</option>';}).join('')+'</select></div>'+
      '<div class="form-group"><label>Description</label><textarea id="rDesc" rows="2"></textarea></div>'+
      '<div class="form-group"><label>Logo</label><input type="file" id="rLogo" accept="image/*"/></div>'+
      '</div>'+
      '<div class="form-group" style="margin-top:8px;">'+
      '<label style="display:flex;align-items:flex-start;gap:8px;font-weight:normal;cursor:pointer;">'+
      '<input type="checkbox" id="rRgpd" style="width:auto;margin-top:3px;flex-shrink:0;"/>'+
      '<span style="font-size:.8rem;">J\'accepte que mes données soient traitées dans le cadre du B2B Matchmaking 2026 conformément à notre <a href="#" onclick="showRgpd();return false;" style="color:var(--red);">politique de confidentialité</a>.</span>'+
      '</label></div>'+
      '<button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="doRegister(\''+role+'\')">S\'inscrire →</button>';
  });
}

function toggleNewSoc(v){var f=ge('newSocFields');if(f)f.style.display=v?'none':'block';}

function doLogin(){
  var email=val('aEmail'),pass=val('aPass');
  if(!email||!pass){setMsg('Remplissez tous les champs.','warn');return;}
  setMsg('Connexion...','info');
  sb.auth.signInWithPassword({email:email,password:pass}).then(function(res){
    if(res.error){setMsg('❌ Mot de passe incorrect.','error');return;}
    setMsg('');loadUser(res.data.user);
  });
}

function doRegister(role){
  var contact=val('rContact'),email=val('rEmail'),pass=val('rPass'),pass2=val('rPass2');
  var existingId=val('rExisting'),societe=val('rSociete'),secteur=val('rSecteur'),desc=val('rDesc');
  var inviteCode=val('rInviteCode');
  if(!contact||!email||!pass){setMsg('Remplissez tous les champs.','warn');return;}
  if(!existingId&&(!societe||!secteur)){setMsg('Renseignez la société et le secteur.','warn');return;}
  if(pass!==pass2){setMsg('Mots de passe différents.','warn');return;}
  if(pass.length<6){setMsg('Mot de passe trop court.','warn');return;}
  if(!ge('rRgpd')||!ge('rRgpd').checked){setMsg('Vous devez accepter la politique de confidentialité.','warn');return;}

  function proceed(){
    var file=ge('rLogo')&&ge('rLogo').files&&ge('rLogo').files[0];
    function doCreate(logoUrl){
      sb.auth.signUp({email:email,password:pass}).then(function(res){
        if(res.error){setMsg('❌ '+res.error.message,'error');return;}
        var uid=res.data.user.id;
        sb.from('profiles').insert({id:uid,role:role,name:existingId?'':societe,sector:existingId?'':secteur,contact:contact,description:desc}).then(function(){
          if(existingId){
            var mt=role==='partner'?'partner_members':'startup_members';
            var col=role==='partner'?'partner_id':'startup_id';
            var obj={profile_id:uid};obj[col]=existingId;
            sb.from(mt).insert(obj);
          } else {
            var tbl=role==='partner'?'partners':'startups';
            var data={profile_id:uid,name:societe,sector:secteur,contact:contact,email:email,description:desc,is_vc:false};
            if(logoUrl)data.logo_url=logoUrl;
            sb.from(tbl).insert(data).select().single().then(function(r){
              if(r.data){
                var mt=role==='partner'?'partner_members':'startup_members';
                var col=role==='partner'?'partner_id':'startup_id';
                var obj={profile_id:uid};obj[col]=r.data.id;
                sb.from(mt).insert(obj);
              }
            });
          }
          // Marquer le code invitation comme utilisé
          if(role==='partner'&&inviteCode){
            sb.from('invitations').update({used:true}).eq('code',inviteCode.toUpperCase());
          }
        });
        setMsg('✅ Compte créé ! Connectez-vous.','success');
        switchTab('login');
      });
    }
    if(file){
      var path=(role==='partner'?'p':'s')+'_'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      sb.storage.from('logos').upload(path,file).then(function(r){doCreate(r.error?null:SB_URL+'/storage/v1/object/public/logos/'+path);});
    } else {doCreate(null);}
  }

  // Vérifier le code d'invitation pour les partenaires
  if(role==='partner'){
    if(!inviteCode){setMsg('Le code d\'invitation est obligatoire.','warn');return;}
    setMsg('Vérification du code...','info');
    sb.from('invitations').select('*').eq('code',inviteCode.toUpperCase()).eq('used',false).single().then(function(r){
      if(r.error||!r.data){setMsg('❌ Code invalide ou déjà utilisé.','error');return;}
      proceed();
    });
  } else {
    proceed();
  }
}

function logout(){
  sb.auth.signOut().then(function(){
    state={role:null,user:null,profile:null,partner:null,startup:null};
    showPage('login');showLogin();setMsg('');
  });
}

function loadUser(user){
  sb.from('profiles').select('*').eq('id',user.id).single().then(function(res){
    if(res.error||!res.data){setMsg('❌ Profil introuvable.','error');return;}
    var profile=res.data;
    state.user=user;state.profile=profile;state.role=profile.role;
    if(profile.role==='partner'){
      sb.from('partner_members').select('partners(*)').eq('profile_id',user.id).single().then(function(r){
        state.partner=(r.data&&r.data.partners)||null;
        if(!state.partner){sb.from('partners').select('*').eq('profile_id',user.id).single().then(function(r2){state.partner=r2.data||null;finishLoad(profile);});}
        else{finishLoad(profile);}
      });
    } else if(profile.role==='startup'){
      sb.from('startup_members').select('startups(*)').eq('profile_id',user.id).single().then(function(r){
        state.startup=(r.data&&r.data.startups)||null;
        if(!state.startup){sb.from('startups').select('*').eq('profile_id',user.id).single().then(function(r2){state.startup=r2.data||null;finishLoad(profile);});}
        else{finishLoad(profile);}
      });
    } else {finishLoad(profile);}
  });
}

function finishLoad(profile){
  ge('userLabel').textContent=profile.name||state.user.email;
  showPage('app');renderNav();loadTicker();
  navigateTo(profile.role==='admin'?'dashboard':profile.role==='partner'?'myPlanning':'partners');
  subscribeRealtime();
}

function checkSession(){
  sb.auth.getSession().then(function(res){
    if(res.data&&res.data.session){loadUser(res.data.session.user);}
    else{showLogin();}
  });
}

function initSlots(partnerId){

function saveAccount(){
  var contact=val('acContact').trim();
  var societe=val('acSociete'),sector=val('acSector'),desc=val('acDesc');
  var passEl=ge('acPass'),pass2El=ge('acPass2');
  var pass=passEl?passEl.value:'',pass2=pass2El?pass2El.value:'';
  if(!contact){alert('Le contact est obligatoire.');return;}
  if(pass&&pass.length>0){
    if(pass!==pass2){alert('Les mots de passe ne correspondent pas.');return;}
    if(pass.length<6){alert('Mot de passe trop court (6 caractères minimum).');return;}
    sb.auth.updateUser({password:pass});
  }
  var linkedin=val('acLinkedin'),website=val('acWebsite');
  var eu={name:societe,contact:contact,sector:sector,description:desc,activity_description:desc};
  if(linkedin)eu.linkedin_url=linkedin;
  if(website)eu.website_url=website;
  var tbl=state.role==='partner'?'partners':'startups';
  var entity=state.role==='partner'?state.partner:state.startup;
  sb.from('profiles').update({contact:contact,name:societe,sector:sector}).eq('id',state.user.id);
  if(entity&&entity.id){
    sb.from(tbl).update(eu).eq('id',entity.id).then(function(r){
      if(r.error){alert('❌ Erreur : '+r.error.message);return;}
      if(state.role==='partner'){state.partner=Object.assign({},state.partner,eu);}
      else{state.startup=Object.assign({},state.startup,eu);}
      state.profile=Object.assign({},state.profile,{contact:contact,name:societe,sector:sector});
      ge('userLabel').textContent=societe||state.user.email;
      alert('✅ Compte mis à jour !');
    });
  } else {alert('❌ Entité introuvable.');}
}

// === BOOKING ===
function openBooking(partnerId,partnerName,isVC){
  var o=document.createElement('div');o.className='modal-overlay';
  var box=document.createElement('div');box.className='modal-box';
  box.innerHTML='<div style="display:flex;justify-content:space-between;margin-bottom:14px;">'+
    '<div><div style="font-weight:800;font-size:1.05rem;">'+partnerName+'</div>'+
    (isVC?'<div class="alert alert-warn" style="margin-top:6px;font-size:.78rem;">🔒 Espace VC\'s — Pitch deck obligatoire</div>':'')+'</div>'+
    '<button onclick="closeModal()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;">✕</button></div>'+
    '<div class="alert alert-info" style="font-size:.78rem;">🟢 Libre &nbsp;⬜ Indispo &nbsp;🔴 Mon RDV</div>'+
    '<div id="slotsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:4px;margin-top:10px;"><div class="loading"><div class="spinner"></div></div></div>';
  o.appendChild(box);document.body.appendChild(o);
  sb.from('slots').select('*').eq('partner_id',partnerId).order('time').then(function(res){
    var slots=res.data||[],myTimes=[],confTimes=[];
    if(state.startup){
      Promise.all([
        sb.from('slots').select('time').eq('startup_id',state.startup.id).in('status',['booked','pending']),
        sb.from('conf_registrations').select('conferences(time,duration_min)').eq('startup_id',state.startup.id)
      ]).then(function(r){
        myTimes=(r[0].data||[]).map(function(s){return s.time;});
        (r[1].data||[]).forEach(function(cr){
          var c=cr.conferences;if(!c)return;
          var start=parseInt(c.time.split(':')[0])*60+parseInt(c.time.split(':')[1]);
          var end=start+(c.duration_min||30);
          TIMES.forEach(function(t){var tmin=parseInt(t.split(':')[0])*60+parseInt(t.split(':')[1]);if(tmin>=start&&tmin<end){confTimes.push(t);}});
        });
        renderSlots(box,slots,myTimes,confTimes,partnerName,isVC);
      });
    } else {renderSlots(box,slots,myTimes,confTimes,partnerName,isVC);}
  });
}

function renderSlots(box,slots,myTimes,confTimes,partnerName,isVC){
  var grid=box.querySelector('#slotsGrid');
  grid.innerHTML=slots.map(function(sl){
    var cls,lbl,clickFn='';
    if(myTimes.indexOf(sl.time)>=0){cls='mine';lbl='Mon RDV';}
    else if(sl.status==='booked'||sl.status==='pending'||sl.status==='unavailable'){cls='unavailable';lbl='Indispo';}
    else if(confTimes.indexOf(sl.time)>=0){cls='conflict';lbl='⚠️ Conf';clickFn='bookWithWarn(\''+sl.id+'\',\''+sl.time+'\',\''+partnerName.replace(/'/g,"\\'")+'\','+isVC+')';}
    else{cls='free';lbl='Libre';clickFn='openBookForm(\''+sl.id+'\',\''+sl.time+'\',\''+partnerName.replace(/'/g,"\\'")+'\','+isVC+')';}
    var canClick=(cls==='free'||cls==='conflict')&&state.role==='startup';
    return '<div class="slot '+(canClick?'free':cls)+'" '+(canClick?'onclick="'+clickFn+'"':'')+'>'+
      '<div style="font-size:.7rem;font-weight:700;">'+sl.time+'</div><div class="slot-name">'+lbl+'</div></div>';
  }).join('')||'<p style="color:var(--muted);font-size:.83rem;grid-column:1/-1;padding:10px;">Aucun créneau.</p>';
}

function bookWithWarn(slotId,time,partnerName,isVC){
  if(!confirm('⚠️ Conférence à '+time+'. Prendre quand même ?'))return;
  openBookForm(slotId,time,partnerName,isVC);
}

function openBookForm(slotId,time,partnerName,isVC){
  closeModal();
  showModal('<h2>📅 RDV avec '+partnerName+'</h2>'+
    '<div style="font-size:.83rem;color:var(--muted);margin-bottom:14px;">Créneau : <strong>'+time+'</strong></div>'+
    '<div class="form-group"><label>Commentaire</label><textarea id="bookComment" rows="3" placeholder="Présentez votre projet..."></textarea></div>'+
    '<div class="form-group"><label>Pitch deck '+(isVC?'<span style="color:var(--red);">*obligatoire</span>':'(facultatif)')+'</label>'+
    '<input type="file" id="bookPitch" accept=".pdf,.ppt,.pptx"/></div>'+
    '<div class="btn-group"><button class="btn btn-primary" onclick="confirmBooking(\''+slotId+'\',\''+time+'\',\''+partnerName.replace(/'/g,"\\'")+'\','+isVC+')">Confirmer →</button>'+
    '<button class="btn btn-outline" onclick="closeModal()">Annuler</button></div>');
}

function confirmBooking(slotId,time,partnerName,isVC){
  var comment=val('bookComment');
  var file=ge('bookPitch')&&ge('bookPitch').files&&ge('bookPitch').files[0];
  if(isVC&&!file){alert('Le pitch deck est obligatoire.');return;}
  if(file){
    var path=state.startup.id+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    sb.storage.from('pitchdecks').upload(path,file).then(function(r){
      if(r.error){alert('Erreur upload.');return;}
      sb.storage.from('pitchdecks').createSignedUrl(path,86400*30).then(function(sr){doBooking(slotId,comment,sr.data&&sr.data.signedUrl);});
    });
  } else {doBooking(slotId,comment,null);}
}

function doBooking(slotId,comment,pitchUrl){
  var update={status:'pending',startup_id:state.startup.id,comment:comment||null};
  if(pitchUrl){update.pitch_deck_url=pitchUrl;}
  sb.from('slots').update(update).eq('id',slotId).eq('status','free').then(function(r){
    if(r.error){alert('Ce créneau vient d\'être pris.');return;}
    closeModal();alert('⏳ Demande envoyée !');
  });
}

// === CONFERENCES ===
function pgConferences(el){
  spinEl(el);
  Promise.all([
    sb.from('conferences').select('*').order('time'),
    state.startup?sb.from('conf_registrations').select('conference_id').eq('startup_id',state.startup.id):Promise.resolve({data:[]}),
    state.startup?sb.from('slots').select('time').eq('startup_id',state.startup.id).in('status',['booked','pending']):Promise.resolve({data:[]}),
    state.role==='admin'?sb.from('conf_registrations').select('conference_id,startups(name,contact)'):Promise.resolve({data:[]})
  ]).then(function(r){
    var confs=r[0].data||[];
    var myConfIds=(r[1].data||[]).map(function(x){return x.conference_id;});
    var myRdvTimes=(r[2].data||[]).map(function(x){return x.time;});
    var regsByConf={};
    (r[3].data||[]).forEach(function(x){if(!regsByConf[x.conference_id]){regsByConf[x.conference_id]=[];}if(x.startups){regsByConf[x.conference_id].push(x.startups);}});
    var form=state.role==='admin'?'<div class="card"><h2>Ajouter une conférence</h2>'+
      '<div class="grid2"><div class="form-group"><label>Titre</label><input id="cTitle"/></div>'+
      '<div class="form-group"><label>Heure</label><input id="cTime" placeholder="14:00"/></div>'+
      '<div class="form-group"><label>Durée (min)</label><input id="cDur" type="number" value="30"/></div>'+
      '<div class="form-group"><label>Salle</label><input id="cSalle"/></div></div>'+
      '<div class="form-group"><label>Intervenant(s)</label><input id="cSpeaker"/></div>'+
      '<div class="form-group"><label>Description</label><textarea id="cDesc" rows="2"></textarea></div>'+
      '<button class="btn btn-primary" onclick="addConf()">Ajouter</button></div>':'';
    el.innerHTML='<h1>Conférences</h1><div class="subtitle">Programme & inscriptions</div>'+form+
    confs.map(function(c){
      var isReg=myConfIds.indexOf(c.id)>=0;
      var conflict=false;
      if(myRdvTimes.length){
        var cstart=parseInt(c.time.split(':')[0])*60+parseInt(c.time.split(':')[1]);
        var cend=cstart+(c.duration_min||30);
        myRdvTimes.forEach(function(t){var tmin=parseInt(t.split(':')[0])*60+parseInt(t.split(':')[1]);if(tmin>=cstart&&tmin<cend){conflict=true;}});
      }
      var cj=encodeURIComponent(JSON.stringify({id:c.id,title:c.title,time:c.time,duration_min:c.duration_min,salle:c.salle||'',speaker:c.speaker||'',description:c.description||''}));
      var regs=regsByConf[c.id]||[];
      var regsHtml=state.role==='admin'&&regs.length?'<div style="margin-top:8px;padding:8px;background:#f9f9f9;border-radius:6px;font-size:.78rem;"><div style="font-weight:600;margin-bottom:4px;">👥 Inscrits ('+regs.length+') :</div>'+regs.map(function(s){return '<div>'+s.contact+' — '+s.name+'</div>';}).join('')+'</div>':'';
      var btns=state.role==='admin'?
        '<button class="btn btn-sm" style="background:#f0f0f0;" onclick="editConf(decodeURIComponent(\''+cj+'\'))">✏️</button> <button class="btn btn-sm" style="background:#fee;color:#c00;" onclick="deleteConf(\''+c.id+'\')">🗑</button>':
        isReg?'<button class="btn btn-sm" style="background:#fee;color:#c00;" onclick="unregConf(\''+c.id+'\')">Se désinscrire</button><span class="badge badge-green">✓ Inscrit(e)</span>':
        '<button class="btn btn-primary btn-sm" onclick="regConf(\''+c.id+'\','+conflict+')">S\'inscrire</button>';
      return '<div class="conf-card">'+
        '<div style="font-size:.76rem;color:var(--muted);">🕐 '+c.time+' · '+c.duration_min+' min · '+(c.salle||'')+'</div>'+
        '<div style="font-weight:700;margin:3px 0;">'+c.title+'</div>'+
        '<div style="font-size:.8rem;">🎤 '+(c.speaker||'')+'</div>'+
        (c.description?'<div style="font-size:.78rem;color:#666;margin-top:3px;">'+c.description+'</div>':'')+
        (conflict&&!isReg?'<div class="alert alert-warn" style="font-size:.76rem;margin-top:6px;">⚠️ RDV à ce créneau</div>':'')+
        regsHtml+'<div class="btn-group" style="margin-top:8px;">'+btns+'</div></div>';
    }).join('');
  });
}

        return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">'+
          '<h2 style="margin:0;">'+corner.name+'</h2>'+
          (state.role==='admin'?'<div class="btn-group" style="margin:0;"><button class="btn btn-sm" style="background:#f0f0f0;" onclick="editCorner(decodeURIComponent(\''+cj+'\'))">✏️</button>'+
          '<button class="btn btn-sm" style="background:#fee;color:#c00;" onclick="deleteCorner(\''+corner.id+'\')">🗑</button></div>':'')+
          '</div>'+(corner.description?'<p style="font-size:.82rem;color:#555;margin-bottom:12px;">'+corner.description+'</p>':'')+
          '<div id="ctslots_'+corner.id+'"><div class="loading"><div class="spinner"></div></div></div></div>';
      }).join(''):'<div class="card"><p style="color:var(--muted);text-align:center;padding:20px;">Aucun corner.</p></div>');
    corners.forEach(function(corner){loadCornerSlots(corner.id);});
  });
}

function loadCornerSlots(cornerId){
  var el=ge('ctslots_'+cornerId);if(!el)return;
  sb.from('crash_test_slots').select('*,startups(name,contact)').eq('corner_id',cornerId).order('time').then(function(res){
    var slots=res.data||[];
    var booked=slots.filter(function(s){return s.status==='booked'&&s.startups;});
    el.innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;">'+
      slots.map(function(sl){
        var isMine=state.startup&&sl.startup_id===state.startup.id;
        var isBooked=sl.status==='booked';
        var cls=isMine?'mine':isBooked?'unavailable':'free';
        var canClick=!isBooked&&state.role==='startup'&&!isMine;
        return '<div class="slot '+cls+'" '+(canClick?'onclick="bookCrashTest(\''+sl.id+'\',\''+sl.time+'\')"':'')+'>'+
          '<div style="font-size:.72rem;font-weight:700;">'+sl.time+'</div>'+
          '<div class="slot-name">'+(isMine?'Mon créneau':isBooked?'Réservé':'Libre')+'</div></div>';
      }).join('')+'</div>'+
      (state.role==='admin'&&booked.length?'<div style="margin-top:12px;padding:10px;background:#f9f9f9;border-radius:8px;font-size:.78rem;"><div style="font-weight:600;margin-bottom:6px;">👥 Inscrits :</div>'+booked.map(function(s){return '<div>'+s.startups.contact+' — '+s.startups.name+' · '+s.time+'</div>';}).join('')+'</div>':'');
  });
}

function addCorner(){
  var name=val('ctName'),desc=val('ctDesc'),slotsStr=val('ctSlots');
  if(!name){alert('Donnez un nom.');return;}
  sb.from('crash_test_corners').insert({name:name,description:desc}).select().single().then(function(r){
    if(r.error||!r.data){alert('Erreur.');return;}
    var times=slotsStr.split(',').map(function(t){return t.trim();}).filter(Boolean);
    if(times.length){sb.from('crash_test_slots').insert(times.map(function(t){return {corner_id:r.data.id,time:t,status:'free'};})).then(function(){navigateTo('crashtest');});}
    else{navigateTo('crashtest');}
  });
}

function editCorner(cJson){
  var c=typeof cJson==='string'?JSON.parse(cJson):cJson;
  showModal('<div style="display:flex;justify-content:space-between;margin-bottom:14px;"><h2>✏️ Corner</h2><button onclick="closeModal()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;">✕</button></div>'+
    '<div class="form-group"><label>Nom</label><input id="ecName" value="'+c.name+'"/></div>'+
    '<div class="form-group"><label>Description</label><textarea id="ecDesc2" rows="2">'+c.description+'</textarea></div>'+
    '<div class="form-group"><label>Ajouter créneaux</label><input id="ecSlots" placeholder="16:00,16:30"/></div>'+
    '<div class="btn-group"><button class="btn btn-primary" onclick="saveCorner(\''+c.id+'\')">💾 Enregistrer</button>'+
    '<button class="btn btn-outline" onclick="closeModal()">Annuler</button></div>');
}

function saveCorner(id){
  var slotsStr=val('ecSlots');
  sb.from('crash_test_corners').update({name:val('ecName'),description:val('ecDesc2')}).eq('id',id).then(function(){
    if(slotsStr){var rows=slotsStr.split(',').map(function(t){return {corner_id:id,time:t.trim(),status:'free'};}).filter(function(r){return r.time;});sb.from('crash_test_slots').insert(rows).then(function(){closeModal();navigateTo('crashtest');});}
    else{closeModal();navigateTo('crashtest');}
  });
}

function deleteCorner(id){
  if(!confirm('Supprimer ce corner ?'))return;
  sb.from('crash_test_slots').delete().eq('corner_id',id).then(function(){sb.from('crash_test_corners').delete().eq('id',id).then(function(){navigateTo('crashtest');});});
}

function bookCrashTest(slotId,time){
  if(!confirm('Réserver à '+time+' ?'))return;
  sb.from('crash_test_slots').update({status:'booked',startup_id:state.startup.id}).eq('id',slotId).eq('status','free').then(function(r){
    if(r.error){alert('Créneau déjà pris.');return;}
    alert('✅ Réservé à '+time+' !');navigateTo('crashtest');
  });
}

// === PLANNING ===
function pgPlanning(el){
  spinEl(el);
  sb.from('partners').select('id,name,is_vc,sector').order('name').then(function(r1){
    sb.from('slots').select('partner_id,time,status').then(function(r2){
      var map={};
      (r2.data||[]).forEach(function(s){if(!map[s.partner_id]){map[s.partner_id]={};}map[s.partner_id][s.time]=s.status;});
      var partners=r1.data||[];
      var filterBar='<div class="filter-bar" id="pfBar">'+['Tous'].concat(PSECTORS).map(function(s){
        return '<button class="filter-btn'+(s==='Tous'?' active':'')+'" onclick="filterPlanning(\''+s+'\')">'+s+'</button>';
      }).join('')+'</div>';
      el.innerHTML='<h1>Planning global</h1>'+filterBar+'<div id="pfTable">'+buildPlanTable(partners,map)+'</div>';
      el._p=partners;el._m=map;
    });
  });
}

function buildPlanTable(list,map){
  return '<div style="overflow-x:auto;"><table><tr><th>Heure</th>'+list.map(function(p){return '<th>'+p.name+(p.is_vc?' 🔒':'')+'</th>';}).join('')+'</tr>'+
    TIMES.map(function(t){return '<tr><td style="font-weight:700;color:var(--red);">'+t+'</td>'+
      list.map(function(p){var st=map[p.id]&&map[p.id][t];
        if(!st){return '<td>—</td>';}
        if(st==='booked'||st==='pending'){return '<td style="color:var(--red);">✖</td>';}
        if(st==='unavailable'){return '<td style="color:#bbb;">🔒</td>';}
        return '<td style="color:var(--green);">✔</td>';
      }).join('')+'</tr>';}).join('')+'</table></div>';
}

function filterPlanning(sector){
  var el=document.querySelector('[data-page="planning"]');if(!el)return;
  document.querySelectorAll('#pfBar .filter-btn').forEach(function(b){b.classList.toggle('active',b.textContent===sector);});
  var t=ge('pfTable');if(t){t.innerHTML=buildPlanTable(sector==='Tous'?el._p:(el._p||[]).filter(function(p){return p.sector===sector;}),el._m||{});}
}

// === MY PLANNING ===
function pgMyPlanning(el){
  spinEl(el);
  var p=state.partner;if(!p){el.innerHTML='<p>Profil introuvable.</p>';return;}
  sb.from('slots').select('*').eq('partner_id',p.id).order('time').then(function(res){
    el.innerHTML='<h1>Mon planning — '+p.name+'</h1>'+
      '<div class="alert alert-info">Cliquez pour basculer disponible / indisponible.</div>'+
      '<div class="card"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:4px;">'+
      (res.data||[]).map(function(sl){
        var cls=sl.status==='free'?'free':sl.status==='booked'?'booked':sl.status==='pending'?'pending':'unavailable';
        var lbl=sl.status==='free'?'Dispo':sl.status==='booked'?'Réservé':sl.status==='pending'?'En attente':'Indispo';
        var toggle=sl.status==='free'||sl.status==='unavailable';
        return '<div class="slot '+cls+'" '+(toggle?'onclick="toggleSlot(\''+sl.id+'\',\''+sl.status+'\',this)"':'')+'>'+
          '<div style="font-size:.7rem;font-weight:700;">'+sl.time+'</div><div class="slot-name">'+lbl+'</div></div>';
      }).join('')+'</div></div>';
  });
}

function toggleSlot(id,cur,el){
  var ns=cur==='free'?'unavailable':'free';
  sb.from('slots').update({status:ns}).eq('id',id).then(function(){
    el.className='slot '+ns;el.querySelector('.slot-name').textContent=ns==='free'?'Dispo':'Indispo';
    el.onclick=function(){toggleSlot(id,ns,el);};
  });
}

// === MY AGENDA ===
function pgMyAgenda(el){
  spinEl(el);
  var s=state.startup;if(!s){el.innerHTML='<p>Non connecté</p>';return;}
  Promise.all([
    sb.from('slots').select('time,status,partners(name)').eq('startup_id',s.id).in('status',['booked','pending']).order('time'),
    sb.from('conf_registrations').select('conferences(*)').eq('startup_id',s.id),
    sb.from('crash_test_slots').select('time,crash_test_corners(name)').eq('startup_id',s.id).eq('status','booked')
  ]).then(function(r){
    var events=[];
    (r[0].data||[]).forEach(function(x){events.push({time:x.time,type:'rdv',label:(x.partners&&x.partners.name)||'-',sub:x.status==='pending'?'⏳ En attente':'✅ Confirmé'});});
    (r[1].data||[]).forEach(function(x){var c=x.conferences;if(c){events.push({time:c.time,type:'conf',label:c.title,sub:'🎤 Conférence'});}});
    (r[2].data||[]).forEach(function(x){events.push({time:x.time,type:'crash',label:(x.crash_test_corners&&x.crash_test_corners.name)||'Crash Test',sub:'🔬 Crash Test'});});
    events.sort(function(a,b){return a.time.localeCompare(b.time);});
    el.innerHTML='<h1>Mon agenda — '+s.name+'</h1>'+
      (!events.length?'<div class="card"><p style="color:var(--muted);text-align:center;padding:24px;">Aucun événement.</p></div>':
      '<div class="card">'+events.map(function(e){
        var bg=e.type==='rdv'?'#ffe0e6':e.type==='conf'?'#d4f5ee':'#e0f0ff';
        var color=e.type==='rdv'?'var(--red)':e.type==='conf'?'var(--green)':'#1a5fa0';
        return '<div class="agenda-row"><div class="agenda-time">'+e.time+'</div>'+
          '<div><div style="font-weight:600;">'+e.label+'</div>'+
          '<span style="font-size:.76rem;padding:2px 8px;border-radius:20px;background:'+bg+';color:'+color+';">'+e.sub+'</span></div></div>';
      }).join('')+'</div>');
  });
}

// === PDF ===
function pgMyPDF(el){
  el.innerHTML='<h1>Mon programme PDF</h1>'+
    '<div class="card" style="text-align:center;padding:36px;"><div style="font-size:2.5rem;margin-bottom:14px;">📄</div>'+
    '<button class="btn btn-primary" onclick="generatePDF()" style="padding:11px 24px;">⬇️ Télécharger</button></div>';
}

function generatePDF(){
  var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  var user=state.role==='partner'?state.partner:state.startup;
  if(!user){alert('Profil introuvable');return;}
  var W=210,m=15,y=45;
  doc.setFillColor(26,26,46);doc.rect(0,0,W,35,'F');
  doc.setFillColor(255,0,50);doc.rect(0,30,W,5,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(18);doc.setFont('helvetica','bold');doc.text('FRENCH TECH PARIS-SACLAY',m,14);
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text('B2B Matchmaking 2026',m,22);
  doc.setFontSize(9);doc.text('Généré le '+new Date().toLocaleDateString('fr-FR'),W-m,22,{align:'right'});
  doc.setFillColor(244,244,247);doc.roundedRect(m,y,W-2*m,18,3,3,'F');
  doc.setTextColor(26,26,46);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text(user.name,m+6,y+8);
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(100,100,100);
  doc.text((user.contact||'')+' · '+(user.email||''),m+6,y+14);y+=26;
  function sec(t,r,g,b){doc.setFillColor(r,g,b);doc.rect(m,y,W-2*m,8,'F');doc.setTextColor(255,255,255);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text(t,m+4,y+5.5);y+=12;}
  function row(l,rv,alt){if(alt){doc.setFillColor(249,249,252);doc.rect(m,y-1,W-2*m,7,'F');}doc.setTextColor(26,26,46);doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text(l,m+4,y+4);doc.setFont('helvetica','normal');doc.text(rv,m+28,y+4,{maxWidth:W-m-32});y+=8;if(y>270){doc.addPage();y=20;}}
  function footer(){doc.setFillColor(26,26,46);doc.rect(0,285,W,12,'F');doc.setTextColor(255,255,255);doc.setFontSize(8);doc.text('La French Tech Paris-Saclay · B2B Matchmaking 2026',m,292);doc.save('programme_'+user.name.replace(/\s+/g,'_')+'.pdf');}
  if(state.role==='partner'){
    sb.from('slots').select('time,startups(name,contact,email)').eq('partner_id',user.id).eq('status','booked').order('time').then(function(res){
      sec('📅 RDV Confirmés ('+(res.data||[]).length+')',26,26,46);
      (res.data||[]).forEach(function(s,i){var su=s.startups||{};row(s.time,(su.contact||su.email||'-')+' — '+(su.name||'-'),i%2===0);});
      footer();
    });
  } else {
    sb.from('slots').select('time,partners(name,contact)').eq('startup_id',user.id).eq('status','booked').order('time').then(function(r1){
      sec('📅 Mes RDV ('+(r1.data||[]).length+')',26,26,46);
      (r1.data||[]).forEach(function(r,i){row(r.time,(r.partners?r.partners.name+' — '+(r.partners.contact||''):'-'),i%2===0);});
      y+=4;
      sb.from('conf_registrations').select('conferences(title,time,salle)').eq('startup_id',user.id).then(function(r2){
        sec('🎤 Conférences ('+(r2.data||[]).length+')',220,0,40);
        (r2.data||[]).forEach(function(r,i){var c=r.conferences;if(c){row(c.time,c.title+' · '+(c.salle||''),i%2===0);}});
        footer();
      });
    });
  }
}

window.addEventListener('load',function(){checkSession();});
</script>
